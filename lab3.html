<!DOCTYPE html>
<html>
<head>
    <title>Table Layout</title>
</head>
<body>
 
<table border="1" cellspacing="0" cellpadding="15"
       style="width:450px; height:300px; text-align:left;">
 
    <tr>
        <td>11</td>
        <td>12</td>
        <td colspan="2">13</td>
        <td rowspan="5">14</td>
    </tr>
 
    <tr>
        <td colspan="3">17</td>
        <td rowspan="3">15</td>
    </tr>
 
    <tr>
        <td colspan="3">16</td>
    </tr>
 
    <tr>
        <td rowspan="2">18</td>
        <td colspan="2">19</td>
    </tr>
 
    <tr>
        <td>20</td>
        <td>21</td>
        <td></td>
    </tr>
 
</table>
 
</body>
</html>
