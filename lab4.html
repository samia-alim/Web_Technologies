<!DOCTYPE html>
<html>
<head>
<title>Registration form</title>
</head>
<body>
<form>

<label for="fullname">Fullname:</label>
<input type= "text" name="full name" id="fullname" required>
<br><br>

<label for="password">password:</label>
<input type= "password" name="password" id="password" required>
<br><br>

<label for="dob">Date of birth:</label>
<input type= "Date" name="dob" id="dob" required>
<br><br>

<label for="image">choose your photo:</label>
<input type= "image" name="photo" id="photo" required>
<br><br>

<label for="gender">gender:</label>
<input type= "radio" name="gender" id="gender" value="male">Male

<label for="gender">gender:</label>
<input type= "radio" name="gender" id="gender" value="female">female
<br><br>

<label for="religion">religion:</label>
<input type= "checkbox" name="r1" id="r1" value="islam" checked >Islam
<br><br>

<label for="religion">religion:</label>
<input type= "checkbox" name="r2" id="r2" value="hindu" checked >hindu
<br><br>

<div>
<label for="department">Department:</label>
<select name="department">
<option value "CSE" selected>CSE</option>
<option value "EEE" selected>EEE</option>
</select>
</div><br>

<div>
<label for="Address">Write down the address:</label>
<textarea rows ="15"></textarea>
</div><br>

<div>
<input type="submit"value="Register">
<input type="reset" value="Clear" Disabled>
</div><br>
</form>
</body>
</html>
